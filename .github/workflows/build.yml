name: build

# Build single-file binaries with Nuitka (onefile, no compression)
# for Ubuntu 22.04 on amd64 and aarch64 (native ARM runners).
#
# Note: the ubuntu-22.04-arm runners are free only for public repositories.
# If this repo is private, ARM jobs will bill per-minute.

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/build.yml'
    tags: ['v*']
  pull_request:
    paths: ['*.py', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target.runner }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nuitka and build deps
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard Pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache patchelf

      - name: Compute version and Shanghai timestamp
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          fi
          SHANGHAI_TIME="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHANGHAI_TIME=${SHANGHAI_TIME}" >> "$GITHUB_ENV"
          echo "version=${VERSION}  shanghai=${SHANGHAI_TIME}"

      - name: Build binaries (onefile, no compression)
        run: |
          mkdir -p dist
          for script in resign.py mklogo.py core.py; do
            name="${script%.py}"
            echo "::group::Building $name"
            python -m nuitka \
              --standalone \
              --onefile \
              --include-package=PIL \
              --output-filename="${name}-${{ matrix.target.arch }}" \
              --output-dir=dist \
              --assume-yes-for-downloads \
              --verbose \
              --verbose-output="dist/nuitka-build-${name}.log" \
              --onefile-no-compression \
              --static-libpython=yes \
              --remove-output \
              "$script"
            echo "::endgroup::"
          done

      - name: Smoke test
        run: |
          for bin in resign-${{ matrix.target.arch }} mklogo-${{ matrix.target.arch }} core-${{ matrix.target.arch }}; do
            echo "::group::$bin -V"
            chmod +x "dist/$bin"
            "./dist/$bin" -V || true
            echo "::endgroup::"
          done

      - name: Stage artifacts
        run: |
          mkdir -p stage
          cp dist/resign-${{ matrix.target.arch }} \
             dist/mklogo-${{ matrix.target.arch }} \
             dist/core-${{ matrix.target.arch }} \
             stage/
          # include all build logs
          cp dist/nuitka-build-*.log stage/ 2>/dev/null || true
          echo "--- stage contents ---"
          ls -la stage/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact v4 zips the staged directory automatically; this
          # name becomes the downloadable .zip filename.
          name: release-bin-${{ env.BUILD_VERSION }}-${{ matrix.target.arch }}-${{ env.SHANGHAI_TIME }}
          path: stage
          if-no-files-found: error

  build-android:
    name: ubuntu-22.04-arm / android-aarch64
    runs-on: ubuntu-22.04-arm
    # Build Android aarch64 onefile binaries inside a native Termux container.
    # The aarch64 container matches the aarch64 host, so no QEMU/binfmt_misc is
    # needed and compilation runs at native speed.

    steps:
      - uses: actions/checkout@v4

      - name: Compute version and Shanghai timestamp
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          fi
          SHANGHAI_TIME="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHANGHAI_TIME=${SHANGHAI_TIME}" >> "$GITHUB_ENV"
          echo "version=${VERSION}  shanghai=${SHANGHAI_TIME}"

      - name: Build binaries in Termux aarch64 container
        run: |
          mkdir -p dist
          chmod 777 dist
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            termux/termux-docker:aarch64 \
            sh .github/scripts/build-android-inner.sh

      - name: Stage artifacts
        run: |
          mkdir -p stage
          cp dist/resign-android-aarch64 \
             dist/mklogo-android-aarch64 \
             dist/core-android-aarch64 \
             stage/
          cp dist/nuitka-build-*.log stage/ 2>/dev/null || true
          echo "--- stage contents ---"
          ls -la stage/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ env.BUILD_VERSION }}-android-aarch64-${{ env.SHANGHAI_TIME }}
          path: stage
          if-no-files-found: error
