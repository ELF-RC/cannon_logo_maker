name: build

# Build single-file binaries with Nuitka (--mode=onefile, no compression)
# for Ubuntu 22.04 on amd64 and aarch64 (native ARM runners).
#
# Note: the ubuntu-22.04-arm runners are free only for public repositories.
# If this repo is private, ARM jobs will bill per-minute.

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/build.yml'
    tags: ['v*']
  pull_request:
    paths: ['*.py', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target.runner }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nuitka and build deps
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache patchelf

      - name: Build binaries (onefile, no compression)
        run: |
          mkdir -p dist
          for script in resign.py mklogo.py core.py; do
            name="${script%.py}"
            echo "::group::Building $name"
            python -m nuitka \
              --standalone \
              --onefile \
              --output-filename="${name}-${{ matrix.target.arch }}" \
              --output-dir=dist \
              --assume-yes-for-downloads \
              --verbose \
              --verbose-output="dist/nuitka-build-${name}.log" \
              --onefile-no-compression \
              --static-libpython=yes \
              --remove-output \
              "$script"
            echo "::endgroup::"
          done

      - name: Smoke test
        run: |
          for bin in resign-${{ matrix.target.arch }} mklogo-${{ matrix.target.arch }} core-${{ matrix.target.arch }}; do
            echo "::group::$bin -V"
            chmod +x "dist/$bin"
            "./dist/$bin" -V || true
            echo "::endgroup::"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target.arch }}
          path: |
            dist/resign-${{ matrix.target.arch }}
            dist/mklogo-${{ matrix.target.arch }}
            dist/core-${{ matrix.target.arch }}
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
